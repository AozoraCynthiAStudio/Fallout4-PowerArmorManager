; 动力甲仓库 UI 校准配置
; 基准分辨率：1280x720。可在游戏外编辑，保存后重新打开面板。

[profile]
; UI 的基准高度。当前所有百分比和 px 调整以 1280x720 为参考。
baseHeight=720

[responsive]
; 高度超过 800p 时，UI 尺寸随屏幕高度增长的比例；100=按比例增长。
layoutGrowthPercent=100
; UI 最小缩放比例；100=不小于基准尺寸。
minimumScalePercent=100
; UI 最大缩放比例；300=最多放大到基准尺寸的 3 倍。
maximumScalePercent=300

[variables]
; ===== 设备外壳：整体大小和位置 =====
; 外壳宽度：取屏幕宽度 30% 与屏幕高度 51% 中较小值。改它会同时改变外壳、屏幕和底部按键大小。
terminal-width=min(27vw,57vh)
; 外壳高度：auto=按设备图片比例自动计算，不建议修改。
terminal-height=auto
; 外壳右边缘距离屏幕右边的距离。数值越大，设备越向左；数值越小，设备越靠右。
terminal-right=0vw
; 外壳垂直定位基准。数值越大，设备整体越向下；85% 是当前 SteamDeck 800p 的基准。
terminal-top=65%
; 设备整体水平微调。正值向右，负值向左；只移动整体，不改变屏幕和按键相对位置。
terminal-offset-x=0px
; 设备整体垂直微调。正值向下，负值向上；只移动整体，不改变屏幕和按键相对位置。
terminal-offset-y=0px

; ===== 外壳观感：只影响设备图片，不影响屏幕文字 =====
; 外壳整体透明度。1=完全不透明；0.86=保留一点游戏场景光线。
terminal-opacity=1
; 外壳亮度。1=原图亮度；大于 1 提亮暗部，小于 1 压暗高光。
terminal-brightness=0.64
; 外壳饱和度。1=原图颜色；小于 1 会减少颜色，让设备更像受场景光照影响。
terminal-saturation=0.6
; 外壳对比度。1=原图对比度；小于 1 会压低“黑太黑、高光太亮”的感觉。
terminal-contrast=0.8

; ===== 屏幕图层：屏幕内容相对外壳的位置和大小 =====
; 屏幕左边缘距离设备左边缘的比例。只移动屏幕内容，不移动外壳。
terminal-screen-left=13.7%
; 屏幕上边缘距离设备上边缘的比例。只移动屏幕内容，不移动外壳。
terminal-screen-top=17%
; 屏幕内容区域宽度。过大会压到外壳边框，过小会留下空黑边。
terminal-screen-width=48%
; 屏幕内容区域高度。过大会压到下方实体按键，过小会显示不下 10 个槽位。
terminal-screen-height=47.5%
; 屏幕第一行内容距离屏幕上沿的内边距。
terminal-screen-padding-top=3%
; 屏幕内所有文字距离屏幕左右边缘的内边距。
terminal-screen-padding-x=4%
; 屏幕内所有文字距离屏幕下沿的内边距。
terminal-screen-padding-bottom=0px
; 标题、槽位导航和槽位列表之间的垂直间距。
screen-content-gap=2px
; 标题区域内部左右元素之间的间距。
screen-head-gap=4px
; 标题区域下方分隔线与标题文字之间的距离。
screen-head-padding-bottom=2px
; 左上角圆形标记大小。
screen-mark-size=0px
; 主标题“动力甲仓库系统/POWER ARMOR STORAGE”的字号。
screen-title-size=14px
; 主标题与英文副标题之间的距离。
screen-subtitle-margin-top=2px
; 英文副标题字号。
screen-subtitle-size=8px
; 页码文字字号，例如“01 - 10 / 50”。
screen-page-size=9px
; “机位列表”这一行距离标题区域的距离。
screen-nav-padding-top=2px
; “机位列表”文字字号。
screen-nav-size=11px
; 槽位行之间的额外间距。
slot-list-gap=1px
; 每一行槽位的高度。想让 10 个槽位更紧凑或更松，改这一行。
slot-row-height=20px
; 槽位编号列宽度，例如 001。
slot-number-width=18%
; 槽位状态符号列宽度，例如 ○/●/◆。
slot-state-width=10%
; 槽位行内部三列之间的间距。
slot-row-gap=3px
; 槽位文字距离每行左右边缘的内边距。
slot-row-padding-x=4px
; 槽位名称字号。
slot-font-size=10px
; 槽位状态符号字号。
slot-state-size=10px

; ===== 底部按键文字和点击区域 =====
; 以下 hardware-rail-* 与 hardware-caps-* 是旧版按键绘制参数，目前由设备贴图负责显示，不需要调整。
; 下面两个值同时影响四个按键文字的横向范围和四个透明点击区域的横向范围。
hardware-left=13.0%
hardware-right=37.5%
; 四个按键之间的间距，同时影响文字列和点击区域列。
hardware-gap=1.5%
; 四个按键文字整体距离设备顶部的比例。只移动文字，不移动按键本体。
hardware-labels-top=69.8%
; 四个按键文字整体区域高度。只影响文字区域，不移动按键本体。
hardware-labels-height=22.4%
; 四个透明点击区域整体距离设备顶部的比例。只影响点击区域，不移动文字。
hardware-hitboxes-top=68.1%
; 四个透明点击区域整体高度。只影响点击区域，不移动文字。
hardware-hitboxes-height=18.0%
; 按键上排字母字号：E/F/R/TAB 或 A/X/Y/B。
hardware-key-size=15px
; 按键下排功能文字字号：存放/详情/命名/返回。
hardware-label-size=13px
; 按键上排和下排文字之间的垂直间距。
hardware-label-gap=4px
; 以下 1-4 只移动或缩放对应按键文字，不移动按键本体和点击区域。
; 1=存放/部署，2=详情，3=命名，4=返回。正 X 向右，正 Y 向下。
hardware-label-1-x=0px
hardware-label-1-y=0px
hardware-label-1-scale=1
hardware-label-2-x=0px
hardware-label-2-y=0px
hardware-label-2-scale=1
hardware-label-3-x=0px
hardware-label-3-y=0px
hardware-label-3-scale=1
hardware-label-4-x=0px
hardware-label-4-y=0px
hardware-label-4-scale=1

; ===== 全部外壳灯效：相关参数集中在本节 =====
; 四个实体按键上方的小横灯。
button-light-left=14%
button-light-top=10%
button-light-width=15%
button-light-height=2px
button-light-opacity=0.72
button-light-glow=5px
button-light-radius=2px
button-light-cycle=2.8s

; SIGNAL 下方五段信号灯：从左到右缓慢波动。
status-led-left=75.5%
status-led-top=26.3%
status-led-width=7%
status-led-height=2.5%
status-led-gap=5%
status-led-bar-height=45%
status-led-radius=1px
status-led-idle-opacity=0.34
status-led-rest-opacity=0.42
status-led-active-opacity=0.96
status-led-glow=4px
status-led-active-glow=7px
status-led-cycle=7.2s

; 右下小槽位：透明序列帧在玻璃内部缓慢呼吸，不参与存放或部署逻辑。
breathing-light-left=77.4%
breathing-light-top=74.5%
breathing-light-width=5.3%
breathing-light-height=8%
breathing-light-radius=3px
; 序列帧整体透明度。建议 0.45 - 0.85。
breathing-light-sprite-opacity=1
; 柔光贴图的染色与亮度。整行是 CSS filter，请保留空格和括号格式。
breathing-light-filter=sepia(1) saturate(3.2) hue-rotate(28deg) brightness(0.78)
; 完成一轮十帧呼吸动画所需时间。
breathing-light-cycle=5.4s

; ===== 详情页文字 =====
; 详情页顶部区域高度。
detail-head-height=20px
detail-head-y=0px
detail-head-padding-top=3px
detail-head-padding-right=6px
detail-head-padding-bottom=3px
detail-head-padding-left=2px
detail-head-gap=9px
; 详情页左侧槽位编号字号。
detail-number-size=10px
detail-number-y=-1.5px
detail-number-line-height=1
; 详情页槽位名称字号。
detail-name-size=10px
detail-meta-y=0px
detail-name-line-height=1
; 详情页“已保存/空槽位”状态字号。
detail-status-size=0px
detail-status-margin-top=4px
detail-status-y=0px
detail-status-line-height=1
; 详情列表距离详情页标题的上边距。
detail-list-margin-top=1px
; 详情列表每个部件行的高度。
detail-row-height=42px
detail-row-gap=7px
detail-row-line-gap=2px
detail-row-padding-y=4px
detail-row-padding-x=6px
; 详情页部件名称字号。
detail-font-size=12px
detail-part-name-y=0px
detail-part-name-line-height=1.05
detail-leader-y=0px
detail-leader-opacity=0.48
; 详情页顶部槽位号；默认隐藏。需要显示时改为 inline-block。
detail-number-display=inline-block
; 详情页部件行号；默认隐藏。需要显示时改为 inline-block。
detail-index-display=none
; 详情页部件行号字号和列宽。
detail-index-size=0.72em
detail-index-column=12px
; 详情页部件右侧耐久百分比字号。
detail-health-size=0.78em
detail-health-y=0px
; 空槽位提示区域高度。
detail-empty-height=130px
; 英文 ERROR 标题字号；中文版不会显示 ERROR。
detail-error-size=25px
; 空槽位辅助提示字号。
detail-empty-size=15px
