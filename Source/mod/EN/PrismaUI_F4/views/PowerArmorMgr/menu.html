<!DOCTYPE html>
<html lang="en">
<head>

<title>Armor Storage</title>
  <style>
    :root {
      --cyan: #a8f5f2;
      --cyan-dim: #6bc8c7;
      --green: #a1efad;
      --yellow: #f2c85a;
      --red: #ed8278;
      --screen: rgb(1, 24, 25);
      --text: #e2f8f4;
      --muted: #7db8b5;
      font-family: "Segoe UI", "Arial Narrow", "Microsoft YaHei UI", sans-serif;
    }
    * { box-sizing: border-box; cursor: none !important; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: transparent; color: var(--text); letter-spacing: 0; }
    body { min-width: 0; }
    button, input { font: inherit; }
    .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .stage:not(.is-ready) .terminal { opacity: 0; transform: translateY(30vh) scale(0.95); }
    .terminal { position: absolute; top: calc(var(--pa-terminal-top, 53%) + var(--pa-terminal-offset-y, 0px)); right: calc(var(--pa-terminal-right, 16vw) - var(--pa-terminal-offset-x, 0px)); width: var(--pa-terminal-width, 480px); height: var(--pa-terminal-height, auto); aspect-ratio: 2 / 3; transform: translateY(-50%); filter: drop-shadow(0 24px 28px rgba(0, 0, 0, 0.52)); }
    .stage.is-entering .terminal { animation: terminal-enter 720ms cubic-bezier(0.18, 0.8, 0.24, 1) both; }
    @keyframes terminal-enter { from { opacity: 0; transform: translateY(30vh) scale(0.95); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
    @keyframes terminal-exit { from { opacity: 1; transform: translateY(-50%) scale(1); } to { opacity: 0; transform: translateY(30vh) scale(0.96); } }
    .stage.is-closing .terminal { animation: terminal-exit 460ms cubic-bezier(0.55, 0.08, 0.68, 0.32) both; }
    .terminal-skin { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: fill; pointer-events: none; user-select: none; opacity: var(--pa-terminal-opacity, 0.86); filter: brightness(var(--pa-terminal-brightness, 1.04)) saturate(var(--pa-terminal-saturation, 0.72)) contrast(var(--pa-terminal-contrast, 0.82)); }
    .terminal-backplate { position: absolute; z-index: 0; left: 14.5%; right: 14.5%; top: 7%; bottom: 6.5%; background: var(--screen); clip-path: polygon(7% 0, 93% 0, 100% 4%, 100% 96%, 93% 100%, 7% 100%, 0 96%, 0 4%); pointer-events: none; }
    .terminal-screen { position: absolute; z-index: 1; left: var(--pa-terminal-screen-left, 20.5%); top: var(--pa-terminal-screen-top, 14.6%); width: var(--pa-terminal-screen-width, 59.4%); height: var(--pa-terminal-screen-height, 66.4%); overflow: hidden; padding: var(--pa-terminal-screen-padding-top, 3.2%) var(--pa-terminal-screen-padding-x, 4%) var(--pa-terminal-screen-padding-bottom, 0px); border: 0; background: var(--screen); color: var(--cyan); box-shadow: inset 0 0 25px rgba(64, 237, 232, 0.08); clip-path: polygon(4% 0, 96% 0, 100% 2.8%, 100% 100%, 0 100%, 0 2.8%); }
    .terminal-screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.22; background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(106, 244, 235, 0.12) 4px); }
    .screen-content { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: var(--pa-screen-content-gap, 6px); }
    .screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--pa-screen-head-gap, 8px); padding-bottom: var(--pa-screen-head-padding-bottom, 6px); border-bottom: 1px solid rgba(96, 222, 218, 0.52); }
    .screen-heading { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .screen-heading > div { min-width: 0; flex: 1 1 auto; }
    .screen-mark { color: var(--yellow); font-size: var(--pa-screen-mark-size, 20px); line-height: 1; }
    .screen-title { color: var(--cyan); max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: var(--pa-screen-title-size, 16px); font-weight: 800; line-height: 1; white-space: nowrap; text-shadow: 0 0 8px rgba(168, 245, 242, 0.2); }
    .screen-subtitle { max-width: 100%; overflow: hidden; text-overflow: ellipsis; margin-top: var(--pa-screen-subtitle-margin-top, 4px); color: var(--cyan-dim); font-size: var(--pa-screen-subtitle-size, 8px); font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
    .screen-page { flex: 0 0 auto; color: var(--cyan-dim); font-size: var(--pa-screen-page-size, 11px); font-weight: 700; white-space: nowrap; }
    .screen-head .screen-page { display: none; }
    .screen-nav { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--pa-screen-nav-padding-top, 4px); color: var(--cyan); font-size: var(--pa-screen-nav-size, 14px); font-weight: 800; }
    .screen-nav span { color: var(--cyan-dim); font-size: 0.82em; font-weight: 700; white-space: nowrap; }
    .slots, .detail-view { min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .slots::-webkit-scrollbar, .detail-view::-webkit-scrollbar { width: 0; height: 0; }
    .slots.page-flip-forward, .slots.page-flip-back { animation: list-refresh 300ms ease-out both; }
    .screen-nav.page-flip { animation: nav-refresh 300ms ease-out both; }
    @keyframes list-refresh { 0% { opacity: 0.18; transform: translateY(4px); clip-path: inset(0 0 100% 0); } 42% { opacity: 0.9; clip-path: inset(0 0 28% 0); } 100% { opacity: 1; transform: none; clip-path: inset(0); } }
    @keyframes nav-refresh { 0% { opacity: 0.45; transform: translateY(2px); } 100% { opacity: 1; transform: none; } }
    .slot-row { min-height: var(--pa-slot-row-height, 28px); display: grid; grid-template-columns: var(--pa-slot-number-width, 16%) minmax(0, 1fr) var(--pa-slot-state-width, 13%); align-items: center; gap: var(--pa-slot-row-gap, 7px); margin-bottom: var(--pa-slot-list-gap, 4px); padding: 0 var(--pa-slot-row-padding-x, 7px); border: 1px solid rgba(80, 173, 172, 0.48); background: rgba(0, 22, 22, 0.54); color: var(--muted); font-size: var(--pa-slot-font-size, 15px); font-weight: 700; cursor: pointer; user-select: none; }

    .slot-row[data-selected="true"] { background: var(--cyan); border-color: var(--cyan); color: #063333; box-shadow: 0 0 10px rgba(164, 245, 243, 0.38); }
    .slot-row[data-selected="true"] .slot-no, .slot-row[data-selected="true"] .slot-state { color: #063333; }
    .slot-no { color: var(--cyan); font-size: 0.78em; font-family: "Cascadia Mono", Consolas, monospace; font-weight: 800; }
    .slot-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-state { justify-self: end; color: var(--cyan-dim); font-size: var(--pa-slot-state-size, 17px); line-height: 1; }
    .slot-state.saved { color: var(--green); }
    .slot-state.primary { color: var(--yellow); }
    [hidden] { display: none !important; }

    .detail-view { grid-row: 2 / 4; padding-right: 2px; }
    .detail-head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: var(--pa-detail-head-gap, 9px); min-height: var(--pa-detail-head-height, 54px); padding: var(--pa-detail-head-padding-top, 5px) var(--pa-detail-head-padding-right, 6px) var(--pa-detail-head-padding-bottom, 8px) var(--pa-detail-head-padding-left, 2px); position: relative; top: var(--pa-detail-head-y, 0px); border-bottom: 1px solid rgba(96, 222, 218, 0.52); }
    .detail-number { color: var(--cyan); display: var(--pa-detail-number-display, none); position: relative; top: var(--pa-detail-number-y, 0px); font: 800 var(--pa-detail-number-size, 26px)/var(--pa-detail-number-line-height, 1) "Cascadia Mono", Consolas, monospace; white-space: nowrap; }
    .detail-meta { min-width: 0; position: relative; top: var(--pa-detail-meta-y, 0px); }
    .detail-name { color: var(--cyan); font-size: var(--pa-detail-name-size, 17px); font-weight: 800; line-height: var(--pa-detail-name-line-height, 1.05); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-status { margin-top: var(--pa-detail-status-margin-top, 4px); position: relative; top: var(--pa-detail-status-y, 0px); color: var(--cyan-dim); font-size: var(--pa-detail-status-size, 10px); font-weight: 700; line-height: var(--pa-detail-status-line-height, 1); white-space: nowrap; }
    .detail-list { display: grid; align-content: start; margin-top: var(--pa-detail-list-margin-top, 6px); }
    .detail-row { min-height: var(--pa-detail-row-height, 42px); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-content: center; column-gap: var(--pa-detail-row-gap, 7px); row-gap: var(--pa-detail-row-line-gap, 2px); padding: var(--pa-detail-row-padding-y, 4px) var(--pa-detail-row-padding-x, 6px); border-bottom: 1px solid rgba(101, 190, 187, 0.3); color: var(--text); font-size: var(--pa-detail-font-size, 14px); font-weight: 700; overflow: hidden; }
    .detail-index { color: var(--cyan-dim); display: var(--pa-detail-index-display, none); font: 800 var(--pa-detail-index-size, 0.72em) "Cascadia Mono", Consolas, monospace; }
    .detail-part-name { grid-column: 1 / -1; min-width: 0; position: relative; top: var(--pa-detail-part-name-y, 0px); white-space: nowrap; word-break: keep-all; overflow: hidden; text-overflow: ellipsis; line-height: var(--pa-detail-part-name-line-height, 1.05); }
    .detail-leader { grid-column: 1; align-self: center; height: 1px; margin-top: var(--pa-detail-leader-y, 0px); overflow: hidden; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 6px); opacity: var(--pa-detail-leader-opacity, 0.48); }
    .detail-condition { grid-column: 2; position: relative; top: var(--pa-detail-health-y, 0px); color: var(--green); font-size: var(--pa-detail-health-size, 0.78em); font-weight: 800; line-height: 1; white-space: nowrap; }
    .detail-empty { min-height: var(--pa-detail-empty-height, 210px); display: grid; place-content: center; justify-items: center; gap: 5px; text-align: center; }
    .detail-empty strong { color: var(--red); font-size: var(--pa-detail-error-size, 25px); letter-spacing: 0.08em; }
    .detail-empty span { color: var(--red); font-size: var(--pa-detail-empty-size, 15px); font-weight: 800; }
    .detail-empty small { color: #bd7169; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; }

    .hardware-rail { display: none; }
    .hardware-caps, .hardware-labels, .hardware-hitboxes { position: absolute; left: var(--pa-hardware-left, 21.5%); right: var(--pa-hardware-right, 21.5%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--pa-hardware-gap, 1.2%); }
    .hardware-caps { display: none; }
    .hardware-cap { position: relative; min-width: 0; border: 1px solid rgba(8, 11, 11, 0.98); border-radius: 3px; background: linear-gradient(180deg, #7c8380 0%, #4b514f 14%, #2c3231 100%); box-shadow: inset 0 1px 0 rgba(236, 241, 238, 0.5), inset 0 -3px 0 rgba(4, 7, 7, 0.72), 0 1px 0 rgba(173, 181, 177, 0.28), 0 2px 2px rgba(0, 0, 0, 0.7); }
    .hardware-cap::after { content: ""; position: absolute; inset: 3px 4px 3px; border: 1px solid rgba(184, 193, 188, 0.58); border-radius: 2px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), inset 0 -1px 0 rgba(232, 237, 233, 0.22); pointer-events: none; }
    .hardware-labels { top: var(--pa-hardware-labels-top, 83.5%); height: var(--pa-hardware-labels-height, 5.8%); z-index: 4; pointer-events: none; }
    .hardware-label { min-width: 0; display: grid; grid-template-rows: auto auto; align-content: center; justify-items: center; gap: var(--pa-hardware-label-gap, 1px); color: rgba(226, 232, 227, 0.96); text-align: center; font-weight: 800; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.98), 0 -1px 0 rgba(255, 255, 255, 0.2); }
    .hardware-label:nth-child(1) { position: relative; left: var(--pa-hardware-label-1-x, 0px); top: var(--pa-hardware-label-1-y, 0px); zoom: var(--pa-hardware-label-1-scale, 1); }
    .hardware-label:nth-child(2) { position: relative; left: var(--pa-hardware-label-2-x, 0px); top: var(--pa-hardware-label-2-y, 0px); zoom: var(--pa-hardware-label-2-scale, 1); }
    .hardware-label:nth-child(3) { position: relative; left: var(--pa-hardware-label-3-x, 0px); top: var(--pa-hardware-label-3-y, 0px); zoom: var(--pa-hardware-label-3-scale, 1); }
    .hardware-label:nth-child(4) { position: relative; left: var(--pa-hardware-label-4-x, 0px); top: var(--pa-hardware-label-4-y, 0px); zoom: var(--pa-hardware-label-4-scale, 1); }
    .hardware-key { color: rgba(242, 245, 242, 0.98); font: 900 var(--pa-hardware-key-size, 19px)/0.98 "Cascadia Mono", Consolas, monospace; letter-spacing: 0.02em; white-space: nowrap; }
    .hardware-desc { color: rgba(225, 231, 226, 0.98); font-size: var(--pa-hardware-label-size, 14px); font-weight: 850; line-height: 1; white-space: nowrap; }
    .hardware-hitboxes { top: var(--pa-hardware-hitboxes-top, 83%); height: var(--pa-hardware-hitboxes-height, 7.3%); z-index: 5; }
    .hardware-hitboxes button { min-width: 0; border: 0; background: transparent; cursor: pointer; }
    .hardware-hitboxes button:focus, .hardware-hitboxes button:focus-visible { outline: none; box-shadow: none; }
    .slot-row:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
    .result-notice { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, 0.36); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 160ms ease, visibility 0s linear 160ms; }
    .result-notice.open { opacity: 1; visibility: visible; transition-delay: 0s; }
    .result-card { width: min(620px, 88vw); min-height: 190px; display: grid; place-content: center; justify-items: center; padding: 28px 36px; border: 2px solid rgba(183, 214, 112, 0.86); background: rgba(8, 20, 10, 0.98); color: #dce8c5; box-shadow: 0 22px 64px rgba(0, 0, 0, 0.58); text-align: center; }
    .result-notice[data-error="true"] .result-card { border-color: rgba(199, 130, 105, 0.92); }
    .result-notice strong { color: var(--phosphor-bright); font-size: var(--pa-result-title-size, 30px); line-height: 1.2; }
    .result-notice[data-error="true"] strong { color: #e5a28c; }
    .result-notice span { margin-top: 14px; color: inherit; font-size: var(--pa-result-body-size, 18px); line-height: 1.45; white-space: pre-line; }
    .result-hint { margin-top: 18px; color: var(--phosphor-dim); font-size: 13px; font-weight: 700; }

    .confirm-overlay, .rename-overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 6, 8, 0.72); }
    .confirm-overlay.open, .rename-overlay.open { display: flex; }
    .confirm-card { width: min(560px, 92vw); padding: 24px 28px; border: 1px solid rgba(164, 245, 243, 0.78); background: rgba(2, 24, 25, 0.98); box-shadow: 0 0 28px rgba(77, 235, 231, 0.22); }
    .confirm-title { color: var(--cyan); font-size: 24px; font-weight: 800; }
    .confirm-message { margin-top: 10px; color: var(--text); font-size: 16px; line-height: 1.45; }
    .confirm-hint { margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(96, 222, 218, 0.3); color: var(--cyan-dim); font-size: 12px; font-weight: 700; }
    .confirm-actions, .rename-actions { display: flex; gap: 10px; margin-top: 14px; }
    .confirm-action, .rename-action { min-width: 96px; min-height: 38px; border: 1px solid rgba(164, 245, 243, 0.5); background: rgba(4, 26, 26, 0.9); color: var(--text); cursor: pointer; }
    .confirm-action[data-selected="true"], .rename-action.accept { color: #062b2b; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px rgba(168, 245, 242, 0.28); }
    .confirm-action:focus, .confirm-action:focus-visible { outline: none; }
    .confirm-action.cancel[data-selected="true"] { color: #32100d; background: var(--red); border-color: var(--red); }
    .rename-card { width: min(520px, 90vw); padding: 24px; border: 1px solid rgba(164, 245, 243, 0.76); background: rgba(2, 24, 25, 0.98); box-shadow: 0 0 28px rgba(77, 235, 231, 0.22); }
    .rename-kicker { color: var(--cyan-dim); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
    .rename-title { margin-top: 5px; color: var(--cyan); font-size: 24px; font-weight: 800; }
    .rename-message { margin-top: 12px; color: var(--text); font-size: 16px; }
    .rename-input { width: 100%; min-height: 44px; margin-top: 16px; padding: 8px 10px; border: 1px solid rgba(164, 245, 243, 0.58); outline: none; background: rgba(0, 14, 15, 0.96); color: var(--text); font: inherit; }
    .rename-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(164, 245, 243, 0.16); }
    .rename-hint { margin-top: 10px; color: var(--cyan-dim); font-size: 12px; font-weight: 700; }
    @media (max-width: 760px), (max-height: 620px) { .confirm-card { padding: 16px; } .confirm-title { font-size: 18px; } .confirm-message { font-size: 13px; } .result-card { width: min(500px, 94vw); min-height: 140px; padding: 18px; } .result-notice strong { font-size: 20px; } .result-notice span { margin-top: 8px; font-size: 14px; } .result-hint { margin-top: 10px; font-size: 11px; } }

    /* BOS shell skin v2.1.8: the PNG supplies the frame, screen glass and physical keys. */
    :root { --phosphor: #b9c985; --phosphor-bright: #dce8aa; --phosphor-dim: #74855d; --phosphor-warn: #c79a55; --screen-ink: rgba(7, 18, 6, 0.68); }
    html[lang="en"] .screen-title, html[lang="en"] .screen-subtitle, html[lang="en"] .screen-nav, html[lang="en"] .slot-row, html[lang="en"] .detail-view, html[lang="en"] .hardware-label { font-family: "Segoe UI", "Arial Narrow", "Microsoft YaHei UI", sans-serif; }
    html[lang="en"] .screen-heading > div { min-width: 0; }
    .terminal { width: var(--pa-terminal-width, min(34vw, 72vh)); filter: drop-shadow(0 20px 24px rgba(0, 0, 0, 0.64)); }
    .terminal-skin { z-index: 2; opacity: var(--pa-terminal-opacity, 0.90); filter: brightness(var(--pa-terminal-brightness, 0.82)) saturate(var(--pa-terminal-saturation, 0.76)) contrast(var(--pa-terminal-contrast, 0.90)); }

    .screen-content { gap: var(--pa-screen-content-gap, 5px); }
    .screen-head { gap: var(--pa-screen-head-gap, 6px); padding-bottom: var(--pa-screen-head-padding-bottom, 5px); border-bottom-color: rgba(142, 169, 91, 0.48); }
    .screen-mark { color: var(--phosphor-warn); font-size: var(--pa-screen-mark-size, 17px); }
    .screen-title, .screen-nav { color: var(--phosphor-bright); }
    .screen-title { font-size: var(--pa-screen-title-size, 18px); text-shadow: 0 0 7px rgba(186, 207, 127, 0.14); }

    .slot-row[data-filled="true"] { border-left-color: var(--phosphor); color: var(--phosphor); }
    .slot-row[data-primary="true"][data-filled="true"] { border-left-color: var(--phosphor-warn); }

    .slot-row[data-selected="true"] .slot-no, .slot-row[data-selected="true"] .slot-state { color: #1d3020; }
    .slot-row[data-primary="true"] { background: rgba(114, 82, 27, 0.28); border-color: rgba(210, 163, 93, 0.82); box-shadow: inset 3px 0 0 rgba(210, 163, 93, 0.86); }

    .slot-row[data-primary="true"][data-selected="true"] .slot-no, .slot-row[data-primary="true"][data-selected="true"] .slot-label, .slot-row[data-primary="true"][data-selected="true"] .slot-state { color: #242313; }
